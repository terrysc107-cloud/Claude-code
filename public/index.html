<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect Your Bank</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231C1714'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='system-ui' font-size='18' font-weight='700' fill='%23DA7756'%3E%24%3C/text%3E%3C/svg%3E">
<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
<style>
  :root { --bg: #1C1714; --surface: #262220; --accent: #DA7756; --text: #F5EDE6; --muted: #9E8E84; --border: #3D3530; --green: #5ABF8A; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 48px; max-width: 440px; width: 90%; text-align: center; }
  .logo { width: 48px; height: 48px; background: var(--accent); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 24px; font-weight: 700; color: #fff; }
  h1 { font-size: 22px; margin-bottom: 12px; }
  p { color: var(--muted); font-size: 14px; margin-bottom: 28px; line-height: 1.6; }
  button { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 14px 32px; font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity .2s; width: 100%; }
  button:hover { opacity: .9; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .status { margin-top: 20px; font-size: 13px; min-height: 20px; }
  .status.ok { color: var(--green); }
  .status.err { color: #ff6584; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--muted); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="logo">$</div>
  <h1>Connect Your Bank</h1>
  <p>Securely link your bank account through Plaid. Your credentials are never stored by us — Plaid handles authentication directly with your bank.</p>
  <button id="connectBtn" onclick="startLink()">Connect Bank Account</button>
  <div class="status" id="status"></div>
</div>

<script>
const SUPABASE_FN = "https://acouuzccqkcpyrckrgwg.supabase.co/functions/v1";
const REDIRECT_URI = window.location.origin + window.location.pathname;

const btn = document.getElementById("connectBtn");
const status = document.getElementById("status");

function createHandler(linkToken, isOAuth) {
  const config = {
    token: linkToken,
    onSuccess: async (public_token, metadata) => {
      status.innerHTML = '<span class="spinner"></span> Connecting your account...';
      try {
        const exRes = await fetch(`${SUPABASE_FN}/exchange-token`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ public_token }),
        });
        const exData = await exRes.json();
        if (exData.success) {
          sessionStorage.removeItem("link_token");
          status.className = "status ok";
          status.textContent = "✓ Bank connected successfully! You can close this tab.";
          btn.textContent = "Connected ✓";
        } else {
          throw new Error(exData.error || "Exchange failed");
        }
      } catch (e) {
        status.className = "status err";
        status.textContent = "Error: " + e.message;
        btn.disabled = false;
      }
    },
    onExit: (err) => {
      if (err) {
        status.className = "status err";
        status.textContent = "Error: " + (err.display_message || err.error_message || "Cancelled");
      } else {
        status.textContent = "";
      }
      btn.disabled = false;
    },
  };

  // Required for OAuth institutions (Chase, Schwab, etc.)
  if (isOAuth) {
    config.receivedRedirectUri = window.location.href;
  }

  return Plaid.create(config);
}

async function startLink() {
  btn.disabled = true;
  status.className = "status";
  status.innerHTML = '<span class="spinner"></span> Initializing...';

  try {
    const res = await fetch(`${SUPABASE_FN}/create-link-token`, { method: "POST" });
    const data = await res.json();
    if (!data.link_token) throw new Error(data.error || "Failed to get link token");

    // Store token for OAuth redirect flow
    sessionStorage.setItem("link_token", data.link_token);

    const handler = createHandler(data.link_token, false);
    status.textContent = "";
    handler.open();
  } catch (e) {
    status.className = "status err";
    status.textContent = "Error: " + e.message;
    btn.disabled = false;
  }
}

// Handle OAuth redirect return (Chase, Schwab, etc.)
// When bank redirects back, URL contains oauth_state_id
window.addEventListener("load", () => {
  const params = new URLSearchParams(window.location.search);
  if (params.has("oauth_state_id")) {
    const linkToken = sessionStorage.getItem("link_token");
    if (linkToken) {
      btn.disabled = true;
      status.innerHTML = '<span class="spinner"></span> Completing bank connection...';
      const handler = createHandler(linkToken, true);
      handler.open();
    } else {
      status.className = "status err";
      status.textContent = "Session expired. Please try connecting again.";
    }
  }
});
</script>
</body>
</html>
